name: Installer site

# Builds the browser installer with the latest release's firmware. The page is served from
# https://gadget.joshai.co/, not GitHub Pages (Pages cannot publish a private repository on a
# free plan), so the build is uploaded as an artifact instead of deployed. FORK.md,
# "Hosting the installer", says how to put a build on the host.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Test
        working-directory: site
        run: npm test
      - name: Fetch the latest release's firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern manifest.json --pattern 'hermes-gadget-*.bin' \
            || echo "No release yet: the page says so."
          gh release download --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'hermes-gadget-*-licenses.zip' \
            || echo "This release has no separate license archive."
      - name: Build
        working-directory: site
        run: node scripts/build.mjs --firmware ../release --out ../_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site
